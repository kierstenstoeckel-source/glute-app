<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glute Tracker" />
  <title>Glute Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0d0d0d; color: #e8e8e8; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .card-enter { animation: fadeIn 0.25s ease forwards; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const ANTHROPIC_API_KEY = ""; // ← PASTE YOUR API KEY HERE

const DEFAULT_PLAN = {
  days: [
    {
      id: "A", label: "Day A", focus: "Glute Max & Hip Width",
      exercises: [
        { id: "a1", name: "Barbell Hip Thrust", sets: 3, reps: "10–12", rest: "90s", priority: "HERO", cue: "Drive through heels, squeeze hard at the top for 1 second. Hips fully extended — chin tucked, ribs down. No spinal compression — this is a safe one.", backNote: null },
        { id: "a2", name: "Lateral Band Walk", sets: 3, reps: "15 each way", rest: "60s", priority: "PRIMARY", cue: "Band above knees. Stay low in a half-squat. Drive out with the side leg — don't let knees cave. Targets the glute med, the muscle responsible for upper/outer fullness.", backNote: null },
        { id: "a3", name: "Frog Pump", sets: 3, reps: "20–25", rest: "60s", priority: "PRIMARY", cue: "Feet together, knees splayed wide. Drive hips up and squeeze. You should feel nothing but glutes — if you feel hamstrings, push knees out wider.", backNote: null },
        { id: "a4", name: "Seated Hip Abduction Machine", sets: 3, reps: "15–20", rest: "60s", priority: "ISOLATION", cue: "Lean slightly forward to shift load to upper glute med. Slow and controlled — the squeeze is the point, not the weight.", backNote: null },
      ],
    },
    {
      id: "B", label: "Day B", focus: "Glute Max Depth & Posterior Chain",
      exercises: [
        { id: "b1", name: "Romanian Deadlift", sets: 3, reps: "10", rest: "90s", priority: "HERO", cue: "Push hips back — not down. Feel a deep hamstring stretch. Bar stays close to legs. Keep weight moderate.", backNote: "Hip hinge only — no spinal load. Stop if you feel it in your lumbar spine." },
        { id: "b2", name: "Bulgarian Split Squat", sets: 3, reps: "8–10 each", rest: "90s", priority: "PRIMARY", cue: "Rear foot elevated on bench. Lean torso slightly forward. Dumbbells in hands, never a barbell on your back.", backNote: "If forward lean causes lower back discomfort, reduce range of motion." },
        { id: "b3", name: "Single-Leg Hip Thrust", sets: 3, reps: "10–12 each", rest: "90s", priority: "PRIMARY", cue: "Same setup as hip thrust but one leg extended. Bodyweight first, then add a dumbbell on the hip when ready.", backNote: null },
        { id: "b4", name: "45° Hyperextension", sets: 3, reps: "12", rest: "60s", priority: "ISOLATION", cue: "Hinge at the hip — not the spine. Squeeze glutes to return. Hold a plate when bodyweight gets easy.", backNote: "Listen to your back. If you feel lumbar fatigue rather than glute work, stop." },
      ],
    },
  ],
};

const PC = {
  HERO:      { bg: "rgba(200,169,126,0.12)", border: "rgba(200,169,126,0.3)", text: "#c8a97e" },
  PRIMARY:   { bg: "rgba(74,158,138,0.12)",  border: "rgba(74,158,138,0.3)", text: "#4a9e8a" },
  ISOLATION: { bg: "rgba(154,128,208,0.12)", border: "rgba(154,128,208,0.3)", text: "#9a80d0" },
};

// ── Storage (localStorage for deployed app) ───────────────────────────────────
function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

// ── AI ────────────────────────────────────────────────────────────────────────
async function askAI(messages, apiKey) {
  if (!apiKey) return { action: "chat", message: "No API key set. Open index.html and paste your Anthropic API key into the ANTHROPIC_API_KEY variable at the top of the script." };
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are a strength coach embedded in a glute-focused workout app. The user is a 33-year-old beginner woman (5'11"), V-shaped butt, wide hips, back injury history from deadlifts. No axial spinal loading. Trains 2–3x/week, full gym.
Respond ONLY in valid JSON. No prose, no markdown, no backticks.
Add: {"action":"add","dayId":"A","exercise":{"id":"unique","name":"...","sets":3,"reps":"...","rest":"...","priority":"HERO|PRIMARY|ISOLATION","cue":"...","backNote":null}}
Remove: {"action":"remove","dayId":"A","exerciseId":"..."}
Swap: {"action":"swap","dayId":"A","exerciseId":"...","exercise":{...}}
Chat: {"action":"chat","message":"..."}`,
        messages,
      }),
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === "text")?.text || "{}";
    return JSON.parse(text);
  } catch(e) { return { action: "chat", message: "Something went wrong. Check your API key and try again." }; }
}

// ── Components ────────────────────────────────────────────────────────────────
function Badge({ priority }) {
  const c = PC[priority] || PC.ISOLATION;
  return <span style={{ fontSize: "0.55rem", background: c.bg, color: c.text, border: `1px solid ${c.border}`, borderRadius: "100px", padding: "2px 8px", letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 600 }}>{priority}</span>;
}

function SetRow({ num, log, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" }}>
      <span style={{ color: "#4a4a6a", fontSize: "0.7rem", width: "14px", flexShrink: 0 }}>{num}</span>
      <input type="number" placeholder="lbs" value={log?.weight ?? ""} onChange={e => onChange({ ...log, weight: e.target.value })}
        style={{ width: "64px", background: "#1a1a1a", border: "1px solid #2a2a2a", borderRadius: "8px", color: "#e8e8e8", padding: "8px 10px", fontSize: "0.8rem", fontFamily: "inherit", outline: "none" }} />
      <span style={{ color: "#3a3a5a", fontSize: "0.7rem" }}>×</span>
      <input type="number" placeholder="reps" value={log?.reps ?? ""} onChange={e => onChange({ ...log, reps: e.target.value })}
        style={{ width: "64px", background: "#1a1a1a", border: "1px solid #2a2a2a", borderRadius: "8px", color: "#e8e8e8", padding: "8px 10px", fontSize: "0.8rem", fontFamily: "inherit", outline: "none" }} />
      <div onClick={() => onChange({ ...log, done: !log?.done })} style={{
        width: "26px", height: "26px", borderRadius: "50%", flexShrink: 0, cursor: "pointer",
        border: `1.5px solid ${log?.done ? "#4a9e8a" : "#3a3a5a"}`,
        background: log?.done ? "#4a9e8a" : "transparent",
        display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.18s",
      }}>
        {log?.done && <span style={{ color: "#fff", fontSize: "0.65rem" }}>✓</span>}
      </div>
    </div>
  );
}

function ExerciseCard({ ex, sessionLog, onLogChange, onRemove }) {
  const [open, setOpen] = useState(false);
  const sets = Array.from({ length: ex.sets }, (_, i) => i);
  const allDone = sets.every(i => sessionLog?.[i]?.done);

  return (
    <div className="card-enter" style={{ background: allDone ? "#0e0e0e" : "#141414", border: `1px solid ${open ? "#3a3a5a" : "#222"}`, borderRadius: "14px", overflow: "hidden", opacity: allDone ? 0.55 : 1, transition: "all 0.25s", marginBottom: "10px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "12px", padding: "16px 18px", cursor: "pointer" }} onClick={() => setOpen(o => !o)}>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap", marginBottom: "4px" }}>
            <span style={{ fontSize: "0.92rem", fontWeight: 500, color: "#e8e8e8" }}>{ex.name}</span>
            <Badge priority={ex.priority} />
            {ex.backNote && <span style={{ fontSize: "0.55rem", background: "rgba(200,80,80,0.12)", color: "#c87e7e", border: "1px solid rgba(200,80,80,0.25)", borderRadius: "100px", padding: "2px 8px", letterSpacing: "0.1em", textTransform: "uppercase" }}>back note</span>}
          </div>
          <div style={{ color: "#5a5a7a", fontSize: "0.72rem" }}>{ex.sets} sets · {ex.reps} · {ex.rest} rest</div>
        </div>
        <span style={{ color: "#3a3a5a", fontSize: "0.65rem", display: "inline-block", transform: open ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>▼</span>
      </div>
      {open && (
        <div style={{ padding: "0 18px 18px", borderTop: "1px solid #1e1e2e" }}>
          <p style={{ color: "#8080a0", fontSize: "0.78rem", lineHeight: "1.7", margin: "14px 0 16px" }}>
            <span style={{ color: "#c8a97e", fontWeight: 500 }}>Cue: </span>{ex.cue}
          </p>
          {ex.backNote && (
            <p style={{ color: "#c87e7e", fontSize: "0.72rem", lineHeight: "1.6", padding: "10px 14px", background: "rgba(200,80,80,0.08)", borderRadius: "8px", borderLeft: "2px solid rgba(200,80,80,0.4)", margin: "0 0 16px" }}>
              ⚠ {ex.backNote}
            </p>
          )}
          <div style={{ marginBottom: "14px" }}>
            <div style={{ display: "flex", gap: "28px", marginBottom: "8px", paddingLeft: "22px" }}>
              <span style={{ color: "#4a4a6a", fontSize: "0.62rem", letterSpacing: "0.1em", textTransform: "uppercase" }}>Weight</span>
              <span style={{ color: "#4a4a6a", fontSize: "0.62rem", letterSpacing: "0.1em", textTransform: "uppercase" }}>Reps</span>
            </div>
            {sets.map(i => <SetRow key={i} num={i + 1} log={sessionLog?.[i]} onChange={v => onLogChange(i, v)} />)}
          </div>
          <button onClick={onRemove} style={{ background: "transparent", border: "1px solid #3a1a1a", color: "#7a4a4a", borderRadius: "8px", padding: "6px 14px", fontSize: "0.7rem", fontFamily: "inherit", cursor: "pointer" }}>
            Remove exercise
          </button>
        </div>
      )}
    </div>
  );
}

function HistoryView({ history }) {
  if (!history.length) return (
    <div style={{ textAlign: "center", padding: "80px 20px", color: "#3a3a5a" }}>
      <div style={{ fontSize: "2.5rem", marginBottom: "14px", opacity: 0.4 }}>○</div>
      <p style={{ fontSize: "0.8rem", lineHeight: "1.8" }}>No sessions yet.<br />Finish a workout to see your history.</p>
    </div>
  );
  return (
    <div>
      {[...history].reverse().map((s, i) => {
        const hasData = s.exercises.some(ex => Object.values(s.logs[ex.id] || {}).some(l => l.done));
        return (
          <div key={i} style={{ background: "#141414", border: "1px solid #222", borderRadius: "14px", padding: "20px", marginBottom: "12px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "14px" }}>
              <div>
                <div style={{ color: "#c8a97e", fontSize: "0.62rem", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: "3px" }}>{s.dayLabel}</div>
                <div style={{ color: "#e8e8e8", fontSize: "0.88rem", fontWeight: 500 }}>{s.dayFocus}</div>
              </div>
              <div style={{ color: "#4a4a6a", fontSize: "0.7rem" }}>{s.date}</div>
            </div>
            {s.exercises.map((ex, j) => {
              const done = Object.values(s.logs[ex.id] || {}).filter(l => l.done);
              if (!done.length) return null;
              return (
                <div key={j} style={{ marginBottom: "10px", paddingLeft: "12px", borderLeft: "2px solid #2a2a2a" }}>
                  <div style={{ color: "#9090b0", fontSize: "0.76rem", marginBottom: "5px" }}>{ex.name}</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
                    {done.map((l, k) => (
                      <span key={k} style={{ background: "#1a1a2a", border: "1px solid #2a2a3a", borderRadius: "6px", padding: "3px 9px", color: "#6a6a9a", fontSize: "0.7rem" }}>
                        {l.weight ? `${l.weight}lb × ` : ""}{l.reps || "—"}
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}
            {!hasData && <p style={{ color: "#3a3a5a", fontSize: "0.72rem" }}>Session logged, no sets marked complete.</p>}
          </div>
        );
      })}
    </div>
  );
}

function AIChat({ plan, onPlanUpdate }) {
  const [msgs, setMsgs] = useState([
    { role: "assistant", text: !ANTHROPIC_API_KEY
        ? "⚠ No API key detected. Open index.html and paste your Anthropic API key into the ANTHROPIC_API_KEY variable near the top to enable AI coaching."
        : "Hey! Ask me to add, remove, or swap exercises. Try: \"Add a glute bridge to Day A\" or \"What can I swap for hyperextensions?\"" }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [pending, setPending] = useState(null);
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, loading]);

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    setInput("");
    const userMsg = { role: "user", text };
    setMsgs(prev => [...prev, userMsg]);
    setLoading(true);
    setPending(null);

    const apiMsgs = [...msgs.slice(1), userMsg].map(m => ({
      role: m.role,
      content: m.role === "user" ? `Current plan: ${JSON.stringify(plan)}\n\n${m.text}` : m.text,
    }));

    const result = await askAI(apiMsgs, ANTHROPIC_API_KEY);
    setLoading(false);

    if (result.action === "chat") {
      setMsgs(prev => [...prev, { role: "assistant", text: result.message }]);
    } else if (result.action === "add" && result.exercise) {
      setPending(result);
      setMsgs(prev => [...prev, { role: "assistant", text: `I'll add **${result.exercise.name}** to Day ${result.dayId}. Confirm below.` }]);
    } else if (result.action === "remove") {
      setPending(result);
      setMsgs(prev => [...prev, { role: "assistant", text: `I'll remove that from Day ${result.dayId}. Confirm below.` }]);
    } else if (result.action === "swap" && result.exercise) {
      setPending(result);
      setMsgs(prev => [...prev, { role: "assistant", text: `I'll swap that with **${result.exercise.name}**. Confirm below.` }]);
    } else {
      setMsgs(prev => [...prev, { role: "assistant", text: "Try being more specific — e.g. 'Add glute bridge to Day A'." }]);
    }
  }

  function applyPending() {
    if (!pending) return;
    const newPlan = JSON.parse(JSON.stringify(plan));
    const day = newPlan.days.find(d => d.id === pending.dayId);
    if (!day) return;
    if (pending.action === "add") {
      day.exercises.push(pending.exercise);
      setMsgs(prev => [...prev, { role: "assistant", text: `✓ Added **${pending.exercise.name}** to Day ${pending.dayId}.` }]);
    } else if (pending.action === "remove") {
      day.exercises = day.exercises.filter(e => e.id !== pending.exerciseId);
      setMsgs(prev => [...prev, { role: "assistant", text: `✓ Removed from Day ${pending.dayId}.` }]);
    } else if (pending.action === "swap") {
      const idx = day.exercises.findIndex(e => e.id === pending.exerciseId);
      if (idx !== -1) day.exercises[idx] = pending.exercise;
      setMsgs(prev => [...prev, { role: "assistant", text: `✓ Swapped in **${pending.exercise.name}**.` }]);
    }
    onPlanUpdate(newPlan);
    setPending(null);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
      <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px 0", display: "flex", flexDirection: "column", gap: "12px" }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
            <div style={{
              maxWidth: "82%",
              background: m.role === "user" ? "#c8a97e" : "#1a1a2a",
              color: m.role === "user" ? "#0d0d0d" : "#b0b0c8",
              border: m.role === "user" ? "none" : "1px solid #2a2a3a",
              borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
              padding: "12px 16px", fontSize: "0.82rem", lineHeight: "1.65",
            }}>
              {m.text.split("**").map((part, j) =>
                j % 2 === 1
                  ? <strong key={j} style={{ color: m.role === "user" ? "#0d0d0d" : "#e8e8e8" }}>{part}</strong>
                  : part
              )}
            </div>
          </div>
        ))}
        {loading && (
          <div style={{ display: "flex", gap: "5px", padding: "12px 16px", background: "#1a1a2a", border: "1px solid #2a2a3a", borderRadius: "16px 16px 16px 4px", width: "fit-content" }}>
            {[0,1,2].map(i => <div key={i} style={{ width: "6px", height: "6px", borderRadius: "50%", background: "#4a4a7a", animation: `pulse 1.2s ${i*0.2}s infinite` }} />)}
          </div>
        )}
        {pending && (
          <div style={{ background: "#0d1a0d", border: "1px solid #1a3a1a", borderRadius: "12px", padding: "14px 16px", display: "flex", gap: "10px", alignItems: "center" }}>
            <span style={{ color: "#6aaa7a", fontSize: "0.78rem", flex: 1 }}>Apply this change to your plan?</span>
            <button onClick={applyPending} style={{ background: "#4a9e8a", color: "#fff", border: "none", borderRadius: "8px", padding: "7px 16px", fontSize: "0.75rem", fontFamily: "inherit", cursor: "pointer", fontWeight: 600 }}>Apply</button>
            <button onClick={() => setPending(null)} style={{ background: "transparent", color: "#6a6a8a", border: "1px solid #2a2a2a", borderRadius: "8px", padding: "7px 14px", fontSize: "0.75rem", fontFamily: "inherit", cursor: "pointer" }}>Cancel</button>
          </div>
        )}
        <div ref={bottomRef} />
      </div>
      <div style={{ padding: "14px 20px", borderTop: "1px solid #1a1a2a", display: "flex", gap: "10px" }}>
        <input
          value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()}
          placeholder="Add, swap, or ask anything…"
          style={{ flex: 1, background: "#141414", border: "1px solid #2a2a2a", borderRadius: "12px", color: "#e8e8e8", padding: "12px 16px", fontSize: "0.82rem", fontFamily: "inherit", outline: "none" }}
        />
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() && !loading ? "#c8a97e" : "#1a1a1a",
          color: input.trim() && !loading ? "#0d0d0d" : "#3a3a5a",
          border: "none", borderRadius: "12px", padding: "0 18px", fontSize: "1rem",
          fontFamily: "inherit", cursor: input.trim() && !loading ? "pointer" : "default",
          fontWeight: 700, transition: "all 0.18s", minWidth: "44px",
        }}>↑</button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("workout");
  const [plan, setPlan] = useState(() => lsGet("gb-plan") || DEFAULT_PLAN);
  const [history, setHistory] = useState(() => lsGet("gb-history") || []);
  const [activeDay, setActiveDay] = useState(0);
  const [sessionLogs, setSessionLogs] = useState({});

  useEffect(() => { lsSet("gb-plan", plan); }, [plan]);
  useEffect(() => { lsSet("gb-history", history); }, [history]);

  function updateLog(exId, setIdx, val) {
    setSessionLogs(prev => ({ ...prev, [exId]: { ...(prev[exId] || {}), [setIdx]: val } }));
  }

  function removeExercise(dayIdx, exId) {
    const p = JSON.parse(JSON.stringify(plan));
    p.days[dayIdx].exercises = p.days[dayIdx].exercises.filter(e => e.id !== exId);
    setPlan(p);
  }

  function finishSession() {
    const day = plan.days[activeDay];
    setHistory(h => [...h, {
      date: new Date().toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
      dayLabel: day.label, dayFocus: day.focus,
      exercises: day.exercises, logs: sessionLogs,
    }]);
    setSessionLogs({});
    setTab("history");
  }

  const day = plan.days[activeDay];
  const anyLogged = Object.values(sessionLogs).some(ex => Object.values(ex).some(s => s.done));

  const navItems = [
    ["workout", "Workout"],
    ["history", `History${history.length ? ` (${history.length})` : ""}`],
    ["coach", "AI Coach"],
  ];

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden", background: "#0d0d0d" }}>
      {/* Header */}
      <div style={{ padding: "env(safe-area-inset-top, 20px) 20px 0", background: "#0d0d0d", flexShrink: 0 }}>
        <div style={{ maxWidth: "640px", margin: "0 auto", paddingTop: "20px" }}>
          <p style={{ color: "#4a4a6a", fontSize: "0.6rem", letterSpacing: "0.3em", textTransform: "uppercase", marginBottom: "4px" }}>Glute Builder</p>
          <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: "1.6rem", fontWeight: 700, marginBottom: "18px", background: "linear-gradient(135deg, #f5e6c8, #c8a97e)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
            Your Training
          </h1>
          <div style={{ display: "flex", gap: "6px", marginBottom: "18px" }}>
            {navItems.map(([id, label]) => (
              <button key={id} onClick={() => setTab(id)} style={{
                background: tab === id ? "#c8a97e" : "transparent",
                color: tab === id ? "#0d0d0d" : "#5a5a7a",
                border: `1px solid ${tab === id ? "#c8a97e" : "#2a2a2a"}`,
                borderRadius: "100px", padding: "7px 15px", fontSize: "0.73rem",
                fontFamily: "inherit", cursor: "pointer", fontWeight: tab === id ? 600 : 400, transition: "all 0.18s", whiteSpace: "nowrap",
              }}>{label}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
        {tab === "workout" && (
          <div style={{ flex: 1, overflowY: "auto", padding: "0 20px 120px" }}>
            <div style={{ maxWidth: "640px", margin: "0 auto" }}>
              <div style={{ display: "flex", gap: "10px", marginBottom: "20px" }}>
                {plan.days.map((d, i) => (
                  <button key={d.id} onClick={() => { setActiveDay(i); setSessionLogs({}); }} style={{
                    flex: 1, background: activeDay === i ? "#141414" : "transparent",
                    border: `1px solid ${activeDay === i ? "#c8a97e" : "#222"}`,
                    borderRadius: "12px", padding: "14px", cursor: "pointer", textAlign: "left", transition: "all 0.18s",
                  }}>
                    <div style={{ color: activeDay === i ? "#c8a97e" : "#4a4a6a", fontSize: "0.6rem", textTransform: "uppercase", letterSpacing: "0.15em", marginBottom: "3px" }}>{d.label}</div>
                    <div style={{ color: activeDay === i ? "#e8e8e8" : "#5a5a7a", fontSize: "0.78rem", fontWeight: 500 }}>{d.focus}</div>
                  </button>
                ))}
              </div>
              {day.exercises.map(ex => (
                <ExerciseCard key={ex.id} ex={ex} sessionLog={sessionLogs[ex.id]}
                  onLogChange={(si, v) => updateLog(ex.id, si, v)} onRemove={() => removeExercise(activeDay, ex.id)} />
              ))}
              {anyLogged && (
                <button onClick={finishSession} style={{
                  width: "100%", background: "linear-gradient(135deg, #c8a97e, #a07850)",
                  color: "#0d0d0d", border: "none", borderRadius: "14px",
                  padding: "16px", fontSize: "0.9rem", fontFamily: "inherit",
                  fontWeight: 700, cursor: "pointer", marginTop: "8px",
                }}>Finish Session ✓</button>
              )}
            </div>
          </div>
        )}
        {tab === "history" && (
          <div style={{ flex: 1, overflowY: "auto", padding: "0 20px 40px" }}>
            <div style={{ maxWidth: "640px", margin: "0 auto" }}>
              <HistoryView history={history} />
            </div>
          </div>
        )}
        {tab === "coach" && (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", maxWidth: "640px", width: "100%", margin: "0 auto" }}>
              <AIChat plan={plan} onPlanUpdate={setPlan} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
